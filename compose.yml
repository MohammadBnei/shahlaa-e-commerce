services:
  database:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "medusa"
      POSTGRES_PASSWORD: "medusa"
      POSTGRES_DB: "medusa"
    healthcheck:
      test: ["CMD", "pg_isready", "--host=localhost", "--username=medusa"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_interval: 5s
      start_period: 30s

  cache:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "[ $$(redis-cli ping) = 'PONG' ]"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_interval: 5s
      start_period: 30s

  server:
    image: medusajs/medusa-store-server:latest
    ports:
      - "9000:9000"
    environment:
      DATABASE_URL: "postgres://medusa:medusa@database:5432/medusa"
      REDIS_URL: "redis://cache:6379"
      JWT_SECRET: "supersecret"
      COOKIE_SECRET: "supersecret"
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s


